<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Cafenea La Strada — Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <header class="header">
            <div class="header-topline">
                <div class="brand-mark" aria-hidden="true">LS</div>
                <div class="language-switch" role="group" aria-label="Choose language" id="languageSwitch">
                    <button class="language-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
                    <button class="language-btn" type="button" data-lang="ro" aria-pressed="false">RO</button>
                    <button class="language-btn" type="button" data-lang="ru" aria-pressed="false">RU</button>
                </div>
            </div>
            <h1>Cafenea La Strada</h1>
            <p class="subtitle" id="subtitle">Tourist Menu · Tap any dish for details</p>
        </header>

        <nav class="categories-nav" id="categoriesNav" aria-label="Menu categories"></nav>
        <main class="menu-list" id="menuList" aria-live="polite"></main>

        <footer class="footer">
            <p id="footerText">Please call your waiter to place an order.</p>
        </footer>

        <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle" tabindex="-1" inert>
            <div class="modal-card" id="modalCard">
                <button class="close-btn" id="closeModal" type="button" aria-label="Close dish details">&times;</button>
                <div class="modal-img-container">
                    <img id="modalImg" alt="">
                    <span id="modalBadge" class="modal-badge" hidden></span>
                </div>
                <div class="modal-body">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalWeight"></span>
                        <span id="modalPrice" class="modal-price"></span>
                    </div>
                    <p id="modalDesc"></p>
                    <div class="allergens-section">
                        <strong id="allergensLabel">Allergens:</strong> <span id="modalAllergens"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
