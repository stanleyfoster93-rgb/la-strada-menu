<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafenea La Strada — Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <!-- Шапка -->
        <header class="header">
            <h1>Cafenea La Strada</h1>
            <p class="subtitle">Tourist Menu • Tap any dish for details</p>
        </header>

        <!-- Липкая навигация по категориям -->
        <nav class="categories-nav" id="categoriesNav">
            <!-- Динамически заполняется через JS -->
        </nav>

        <!-- Список блюд -->
        <main class="menu-list" id="menuList">
            <!-- Динамически заполняется через JS -->
        </main>

        <!-- Подвал -->
        <footer class="footer">
            <p>Please call your waiter to place an order.</p>
        </footer>

        <!-- Модальное окно (Pop-up) -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card" id="modalCard">
                <button class="close-btn" id="closeModal">&times;</button>
                <div class="modal-img-container">
                    <img id="modalImg" src="" alt="Dish image">
                    <span id="modalBadge" class="modal-badge"></span>
                </div>
                <div class="modal-body">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalWeight"></span>
                        <span id="modalPrice" class="modal-price"></span>
                    </div>
                    <p id="modalDesc"></p>
                    <div class="allergens-section">
                        <strong>Allergens:</strong> <span id="modalAllergens"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
