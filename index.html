<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171619">
    <title>La Strada — Menu</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <header class="header">
            <div class="brand-row">
                <div class="brand-mark" aria-hidden="true">L</div>
                <div class="header-copy">
                    <h1 class="header-title">La Strada</h1>
                    <p class="subtitle" id="subtitle">Tourist menu · Tap a dish for details</p>
                </div>
            </div>
        </header>

        <nav class="categories-nav" id="categoriesNav" aria-label="Menu categories"></nav>
        <main class="menu-list" id="menuList" aria-live="polite"></main>

        <footer class="footer">
            <div class="footer-bar">
                <p id="footerText">Enjoy your meal.</p>
            </div>
        </footer>

        <div class="modal-overlay" id="modalOverlay" aria-hidden="true" inert>
            <section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <button class="close-btn" id="closeModal" type="button" aria-label="Close dish details">&times;</button>
                <div class="modal-img-wrap" id="modalImageWrap" hidden>
                    <img id="modalImg" alt="">
                    <span id="modalBadge" class="modal-badge" hidden></span>
                </div>
                <div class="modal-body">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <div class="modal-meta">
                        <span id="modalWeight" class="modal-weight"></span>
                        <span id="modalPrice" class="modal-price"></span>
                    </div>
                    <p id="modalDesc" class="modal-desc"></p>
                    <div class="allergens-box" id="allergensBox">
                        <strong id="allergensLabel">Allergens:</strong>
                        <span id="modalAllergens"></span>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
