<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafenea La Strada — Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <header class="header">
            <h1>Cafenea La Strada</h1>
            <p class="subtitle">Tourist Menu • Tap any dish for details</p>
        </header>

        <nav class="categories-nav" id="categoriesNav" aria-label="Menu categories">
            <!-- Categories are rendered from menu.json. -->
        </nav>

        <main class="menu-list" id="menuList" aria-live="polite">
            <!-- Menu items are rendered from menu.json. -->
        </main>

        <footer class="footer">
            <p>Please call your waiter to place an order.</p>
        </footer>

        <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle" tabindex="-1" inert>
            <div class="modal-card" id="modalCard">
                <button class="close-btn" id="closeModal" type="button" aria-label="Close dish details">&times;</button>
                <div class="modal-img-container">
                    <img id="modalImg" alt="">
                    <span id="modalBadge" class="modal-badge" hidden></span>
                </div>
                <div class="modal-body">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalWeight"></span>
                        <span id="modalPrice" class="modal-price"></span>
                    </div>
                    <p id="modalDesc"></p>
                    <div class="allergens-section">
                        <strong>Allergens:</strong> <span id="modalAllergens"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
